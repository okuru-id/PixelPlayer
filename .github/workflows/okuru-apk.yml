name: Build APK (okuru-id)

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: okuru-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner == 'okuru-id'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Set the KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets to sign with
      # a stable key, so new builds install over old ones. Without them a throwaway key is generated.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > vz-pixelplay.jks
          else
            KEYSTORE_PASSWORD=ci-temp-pass KEY_ALIAS=pixelplay-key KEY_PASSWORD=ci-temp-pass
            keytool -genkey -keystore vz-pixelplay.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=PixelPlay CI"
          fi
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -Ppixelplay.enableAbiSplits=true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" app/build/outputs/apk/release/*.apk --generate-notes --repo "${{ github.repository }}"
